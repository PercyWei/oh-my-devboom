# 复制为 config/local.conf，修改后通过 --config 选择。
# 值不加引号；未列出的模块/工具关闭；命令行参数优先。

[modules]
base = true           # 基础工具：git、curl、wget、vim、unzip、zsh
homebrew = true
zsh = true            # Antidote、补全、自动建议、语法高亮（GitHub）
powerlevel10k = true  # Powerlevel10k 主题与 gitstatusd（GitHub）。
tools = false
dotfiles = true       # 部署 Shell、Git、主题预设和插件列表的软链接。

[tools]
# Ubuntu/Debian 使用系统包，macOS 使用 Homebrew
fzf = true       # 模糊查找，以及 Zsh 补全和快捷键
rg = true        # ripgrep：搜索文件内容
bat = true       # 带语法高亮地查看文件
eza = true       # 增强的文件列表
zoxide = true    # 快速跳转常用目录
nvtop = true     # GPU 监控，需要设备与驱动支持
jq = true        # JSON 处理
fd = true        # 查找文件

# 以下工具在 Ubuntu/Debian 上从外部源下载
uv = true        # Astral 官方安装器：Python 环境与依赖管理
zellij = true    # GitHub 发布包：终端分屏与会话管理

[options]
# 直接下载授权：Homebrew/uv 安装器、Antidote 与 Zsh 补全/自动建议/语法高亮插件、
# Powerlevel10k、gitstatusd 和 Zellij 发布包
allow_remote = false                # false：交互时确认，非交互时跳过；
conflict = skip                     # 已有配置：skip 保留；backup 备份后部署软链接
github_proxy = https://ghfast.top/  # GitHub 加速前缀，置空表示直连
