# 复制为 config/local.conf，修改后通过 --config 选择。
# 值不加引号；未列出的模块/工具关闭；命令行参数优先。

[modules]
clash = true          # Linux：先启用 Clash，安装结束后关闭；需填写下面的 config_file
base = true           # 基础工具：git、curl、wget、vim、unzip、zsh
homebrew = true
zsh = true            # Zsh Augmented：Antidote、补全、自动建议、语法高亮（GitHub）
powerlevel10k = true  # Powerlevel10k 主题与 gitstatusd（GitHub）。
tools = true
dotfiles = true       # 复制基础 Shell/Git 配置，按已安装组件部署可选 Zsh 片段及预设
shell = true          # 将当前执行账户的默认登录 Shell 设为 Zsh

[clash]
# 服务器上 Clash/Mihomo YAML 的绝对路径，例如 /root/clash.yaml
# 启用 clash 时必填；代理未就绪则停止安装。macOS 跳过此模块。
# clashctl 安装在 $XDG_DATA_HOME/clashctl，与 oh-my-devboom 数据目录同级。
# 源码从 Gitee 镜像直连下载；Mihomo/yq 使用下面的 GitHub 加速前缀。
config_file =

[tools]
# Ubuntu/Debian 使用系统包，macOS 使用 Homebrew
fzf = true       # 模糊查找，以及 Zsh 补全和快捷键
rg = true        # ripgrep：搜索文件内容
bat = true       # 带语法高亮地查看文件
eza = true       # 增强的文件列表
zoxide = true    # 快速跳转常用目录
nvtop = true     # GPU 监控，需要设备与驱动支持
jq = true        # JSON 处理
fd = true        # 查找文件

# 以下工具在 Ubuntu/Debian 上从外部源下载
uv = true        # Astral 官方安装器：Python 环境与依赖管理
zellij = true    # GitHub 发布包：终端分屏与会话管理

[options]
# 直接下载授权：clashctl 及其 Mihomo/yq 组件、Homebrew/uv 安装器、
# Antidote 与 Zsh 补全/自动建议/语法高亮插件、
# Powerlevel10k、gitstatusd 和 Zellij 发布包
allow_remote = false                # false：交互时确认，非交互时跳过；
conflict = skip                     # 配置冲突：skip 保留；backup 备份后复制
# 已有文件软链接保留当前内容并转为普通文件；其他链接按 conflict 处理。
# Clash 尚未启用时使用此加速前缀；代理就绪后本轮停用。置空表示不加前缀。
github_proxy = https://ghfast.top/
git_timeout = 600                  # Git 下载时限（秒）；整批 Zsh 插件共用此时限
