# 复制为 config/local.conf，通过 --config 使用。
# 值不加引号；未列出的模块和工具关闭；命令行参数优先。

[modules]
clash = true          # Linux 安装期间使用代理；需填写 [clash] config_file
base = true           # git、curl、wget、vim、unzip、zsh
homebrew = true
antidote = true       # Zsh 插件管理器，插件由 .zsh_plugins.txt 配置
powerlevel10k = true  # Zsh 提示符主题与 gitstatusd
tools = true
dotfiles = true       # 复制 Shell/Git 配置及已就绪组件的配置
shell = true          # 将当前账户的默认登录 Shell 设为 Zsh

[clash]
# 本地 Clash/Mihomo YAML 的绝对路径，启用时必填，如 /root/clash.yaml。
# 代理未就绪则停止安装；安装结束后关闭。
# clashctl 安装到 $XDG_DATA_HOME/clashctl，源码与安装包从 Gitee 下载。
config_file =

[tools]
# Ubuntu/Debian 使用系统包，macOS 使用 Homebrew
fzf = true       # 模糊查找、Zsh 补全与快捷键
rg = true        # ripgrep：内容搜索
bat = true       # 文件预览与语法高亮
eza = true       # 增强文件列表
tree = true      # 树状显示目录结构
zoxide = true    # 目录跳转
nvtop = true     # GPU 监控，需驱动和设备访问权限
jq = true        # JSON 处理
fd = true        # 文件查找
gh = true        # GitHub 仓库、Issue 和 PR 管理

# 以下工具在 Ubuntu/Debian 上从外部源下载
uv = true        # Python 环境与依赖管理
zellij = true    # 终端分屏与会话管理

# 通过 uv 隔离安装；自动补齐 uv 和 Python >=3.10。
modelscope-hub = true    # ModelScope Hub，命令 ms-hub
huggingface-hub = true   # Hugging Face Hub，命令 hf

[options]
# 下载授权：clashctl/Mihomo/yq、Homebrew/uv 安装器、Antidote/use-omz、
# Oh My Zsh Git、补全/自动建议/语法高亮插件、Powerlevel10k/gitstatusd、Zellij。
# false：交互确认来源，非交互跳过；包管理器安装不受影响。
allow_remote = false
# 文件软链接保留内容并转为普通文件；其他链接按 conflict 处理。
conflict = skip  # skip 保留已有配置；backup 备份后复制

# GitHub 加速前缀；Clash 就绪后本轮停用，留空不加前缀。
github_proxy = https://ghfast.top/
git_timeout = 600  # Git 下载超时（秒），整批 Zsh 插件共用
