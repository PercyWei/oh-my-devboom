# 安装清单：复制为 config/local.conf 后修改，再通过 --config 选择。
# 这是数据文件，不执行 Shell 命令；只支持 true/false、skip/backup。
# 支持空行、# 注释和键值两边的空格；不要给值加引号。
# 未列出的模块/工具视为 false。命令行参数优先于本文件。

[modules]
# 基础命令：git、curl、wget、vim、unzip、zsh，通过系统包管理器安装。
base = true
# Homebrew：需要官方网络来源；root 和受限容器会按条件跳过。
homebrew = true
# Zsh 增强：Antidote、补全、自动建议、语法高亮，需要访问 GitHub。
zsh = true
# Prompt：Powerlevel10k 与 gitstatusd，需要访问 GitHub 及发布包下载源。
powerlevel10k = true
# 可选工具总开关：只有设为 true，下方 [tools] 的选择才会生效。
tools = false
# 部署 Shell、Git、主题预设和插件列表的软链接；此步骤不联网安装程序。
dotfiles = true

[tools]
# 下列工具默认全部选中，但仅在上方 modules.tools = true 时安装。
# Ubuntu/Debian 使用系统包管理器，可使用国内镜像；macOS 使用 Homebrew。
fzf = true       # 模糊查找，以及 Zsh 补全和快捷键
rg = true        # ripgrep：搜索文件内容
bat = true       # 带语法高亮地查看文件
eza = true       # 增强的文件列表
zoxide = true    # 快速跳转常用目录
nvtop = true     # GPU 监控，需要设备与驱动支持
jq = true        # JSON 处理
fd = true        # 查找文件

# 以下工具在 Ubuntu/Debian 上使用外部下载源，需要稳定网络。
uv = true        # Astral 官方安装器：Python 环境与依赖管理
zellij = true    # GitHub 发布包：终端分屏与会话管理

[options]
# 授权以下直接从上游下载的内容：Homebrew/uv 安装脚本；
# Antidote 与 Zsh 补全、自动建议、语法高亮插件；Powerlevel10k 主题、gitstatusd 和 Zellij 发布包。
# false：交互时逐项确认来源；--non-interactive 时跳过这些直接下载安装步骤。
# 包管理器安装、本地配置部署不受此开关限制；已安装的组件仍可复用。
allow_remote = false
# 已有配置的处理方式：skip 保留；backup 先备份再部署软链接。
conflict = skip
